[package]
name = "inkfinite-cli"
description = "Inspect, edit, validate, and render Inkfinite documents"
authors.workspace = true
categories = ["command-line-utilities", "graphics"]
edition.workspace = true
homepage.workspace = true
keywords = ["canvas", "cli", "diagramming", "local-first"]
license.workspace = true
publish = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "inkfinite"
path = "src/bin/inkfinite-cli.rs"

[[bin]]
name = "generate-bindings"
path = "src/bin/generate-bindings.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
inkfinite-core.workspace = true
resvg.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
ts-rs.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
