[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/inkfinite-cli",
  "crates/inkfinite-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.89"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1.0.103"
automerge = "=0.10.0"
clap = { version = "4.6.1", features = ["derive"] }
inkfinite-core = { path = "crates/inkfinite-core" }
perfect_freehand = "=0.1.1"
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.4.3"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
bool_comparison = "deny"
duplicate_mod = "deny"
inconsistent_struct_constructor = "deny"
invalid_regex = "deny"
mem_forget = "deny"
mixed_case_hex_literals = "deny"
suspicious_arithmetic_impl = "deny"
uninit_assumed_init = "deny"
suspicious_else_formatting = "deny"
suspicious_op_assign_impl = "deny"
suspicious_to_owned = "deny"
cmp_owned = "deny"
cmp_null = "deny"
manual_map = "deny"

too_many_arguments = "warn"
cognitive_complexity = "warn"
large_enum_variant = "warn"
needless_borrow = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
unnecessary_cast = "warn"
inefficient_to_string = "warn"
or_fun_call = "warn"
unnecessary_to_owned = "warn"
map_clone = "warn"
flat_map_identity = "warn"
needless_collect = "warn"
vec_init_then_push = "warn"

len_zero = "allow"
range_plus_one = "allow"
manual_range_contains = "allow"
